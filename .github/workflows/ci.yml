name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Configure SSH for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy static export to VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '49152' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: >
          rsync -az --delete
          -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT -o StrictHostKeyChecking=yes"
          out/ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Verify site is live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          base_url="https://maxightai.ru"

          check_page() {
            path="$1"
            marker="$2"
            body_file="$(mktemp)"
            code=$(curl --fail --silent --show-error --location --max-time 20 \
              --output "$body_file" --write-out "%{http_code}" "$base_url$path") || code="curl-failed"
            if [ "$code" != "200" ] || ! grep -Fq "$marker" "$body_file"; then
              echo "::error::Smoke check failed for $path (HTTP $code, marker: $marker)"
              rm -f "$body_file"
              return 1
            fi
            echo "Smoke check passed for $path (HTTP $code)"
            rm -f "$body_file"
          }

          for attempt in 1 2 3 4 5; do
            if check_page "/" "<main" \
              && check_page "/projects/" "Pro-leads" \
              && check_page "/blog/" "Блог" \
              && check_page "/rss.xml" "<rss" \
              && check_page "/sitemap.xml" "<urlset"; then
              not_found_code=$(curl --silent --show-error --location --max-time 20 \
                --output /dev/null --write-out "%{http_code}" "$base_url/__ci_known_404__")
              if [ "$not_found_code" = "404" ]; then
                echo "Smoke check passed for /__ci_known_404__ (HTTP 404)"
                exit 0
              fi
              echo "Attempt $attempt: expected HTTP 404 for known missing route, got $not_found_code"
            else
              echo "Attempt $attempt: one or more critical-route checks failed"
            fi
            sleep 5
          done

          echo "::error::Site smoke checks failed after deploy"
          exit 1

      - name: Comment PR status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}" === "success" ? "✅ CI прошёл" : "❌ CI упал";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${status} (lint, build, e2e) — [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
